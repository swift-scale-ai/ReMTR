[package]
name = "remtr"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
description = "A graphical MTR-inspired network path monitor for Apple Silicon Macs"
license = "GPL-2.0-or-later"
readme = "README.md"
repository = "https://github.com/swiftscalecloud/ReMTR"
homepage = "https://github.com/swiftscalecloud/ReMTR"
documentation = "https://github.com/swiftscalecloud/ReMTR/tree/main/docs"
keywords = ["mtr", "traceroute", "icmp", "macos", "tui"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
crossterm = "0.28.1"
instability = "=0.3.9"
libc = "=0.2.191"
ratatui = "0.29.0"
unicode-segmentation = "=1.12.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
