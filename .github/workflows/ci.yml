name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify native arm64 runner
        run: test "$(uname -m)" = arm64
      - name: Install Rust 1.83
        run: |
          rustup toolchain install 1.83.0 --profile minimal --component rustfmt,clippy
          rustup default 1.83.0
      - name: Format
        run: cargo fmt -- --check
      - name: Check
        run: cargo check --locked
      - name: Test
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release --locked
      - name: Loopback probe smoke test
        if: github.event_name != 'pull_request'
        run: sudo ./target/release/remtr --snapshot --max-hops 1 --timeout-ms 100 --interval-ms 10 127.0.0.1
      - name: Package and verify
        run: |
          ./scripts/package-macos.sh
          ./scripts/verify-package.sh dist/remtr-*.tar.gz
      - name: Upload executable package
        uses: actions/upload-artifact@v7
        with:
          path: dist/remtr-*-aarch64-apple-darwin.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload SHA-256 checksum
        uses: actions/upload-artifact@v7
        with:
          path: dist/remtr-*-aarch64-apple-darwin.tar.gz.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14
